name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Pinned toolchain is the MSRV — building on it is the MSRV check.
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2

      # The keychain has three backends, and only one of them is compiled on each host, so the
      # suite runs everywhere rather than on macOS alone.
      #
      # The GUI crates are part of the workspace, so a Linux build also needs the windowing
      # headers: winit's wayland backend links libwayland-client and libxkbcommon at build time.
      - name: apt packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools libwayland-dev libxkbcommon-dev pkg-config

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: layers
        run: cargo xtask layers

      # The checklist is generated on one platform and compared everywhere: it is a function of the
      # registry, not of the host, so a difference is a real difference.
      - name: parity is up to date
        run: cargo xtask parity-check
