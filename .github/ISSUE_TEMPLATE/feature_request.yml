name: Feature request
description: Propose a new capability or improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What gap or friction does this address? Who is affected, and how often?
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: Catalog area / gap
      description: Which area of the tool does this touch, and does it map to an entry in docs/gaps.md? Link the gap if it exists.
      placeholder: |
        Area: Transfer / Import
        Gap: docs/gaps.md §Transfer — "Import Excel (xlsx)"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How should it work? UI sketch, CLI shape, or command parameters are all useful.
    validations:
      required: true

  - type: input
    id: command_id
    attributes:
      label: Proposed command id (if this is a new command)
      description: |
        Every user-visible behaviour is a CommandSpec with an id in crates/engine/src/catalog.rs.
        If this request adds a new command, propose an id here. Warning: ids must not collide with
        or rename existing ones — check the catalog before suggesting.
      placeholder: "e.g. import.excel, reports.pivot, schema.renameColumn"

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they were rejected.
