# The lint baseline follows the crate's declared `rust-version` (Cargo.toml). Raise both together:
# a suggestion that only a newer stdlib satisfies must not be raised here.
msrv = "1.95"

# Tests may unwrap: a failing assertion should point at the line, not at error plumbing.
# Production code is still guarded by the deny list in each crate root.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
