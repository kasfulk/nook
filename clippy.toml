# The lint baseline follows the crate's declared `rust-version` (Cargo.toml). Keep the two in sync:
# a lower value here silently hides suggestions the toolchain already supports.
msrv = "1.95"

# Tests may unwrap: a failing assertion should point at the line, not at error plumbing.
# Production code is still guarded by the deny list in each crate root.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
