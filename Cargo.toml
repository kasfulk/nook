[workspace]
resolver = "2"
members = [
  "xtask",
  "crates/ui",
  "apps/nook",
  "crates/mcp",
  "apps/nook-cli",
  "crates/core",
  "crates/ai",
  "crates/model",
  "crates/drivers",
  "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
nook-core = { path = "crates/core" }
nook-ai = { path = "crates/ai" }
nook-model = { path = "crates/model" }
nook-drivers = { path = "crates/drivers" }
nook-engine = { path = "crates/engine" }
nook-mcp = { path = "crates/mcp" }
nook-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` is not a size optimisation: without it libsqlite3-sys looks for a system
# `sqlite3.lib`, which Windows does not ship, so every Windows link failed with LNK1181.
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
mysql = "28"
# default-features = false is deliberate (no wgpu, glow instead), but that also drops winit's
# x11/wayland backends, which winit turns into a compile_error on Linux. Name them explicitly.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
rfd = "0.15"

[profile.release]
opt-level = 2
lto = "thin"

[profile.dev]
debug = 1
